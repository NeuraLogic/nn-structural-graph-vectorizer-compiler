[project]
name = "compute-graph-vectorize"
version = "0.1.0"
description = "Neural Network Structural Graph Vectorizer/Compiler (for NeuraLogic)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "click>=8.0",
    "jpype1>=1.3.0",
    "matplotlib>=3.5",
    "networkx>=2.8",
    "neuralogic>=0.9.2",
    "numpy>=1.20.4",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "torch-scatter>=2.1",
    "tqdm>=4.60",
    "typing-extensions>=4.0",
]

[dependency-groups]
dev = [
    "basedpyright",
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compute_graph_vectorize"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-continue-on-failure --strict-markers"
pythonpath = ["src"]
markers = [
    "long: marks tests as long",
    "extended: marks tests as extended",
    "common: marks tests as common",
]

[tool.basedpyright]
# many settings are not enabled even in strict mode, which is why basedpyright includes an "all" option
# you can then decide which rules you want to disable
typeCheckingMode = "basic"
diagnosticMode = "workspace"
autoImportCompletions = true
